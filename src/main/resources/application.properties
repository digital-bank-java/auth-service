spring.application.name=auth-service
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=${digital-bank.service.runtime-profile:${spring.profiles.active:default}}
logging.structured.json.rename.service=ecs_service
logging.structured.json.rename.correlation_id=ecs_correlation_id
logging.structured.json.rename.traceId=ecs_trace_id
logging.structured.json.rename.spanId=ecs_span_id
logging.structured.json.rename.flat_service=service
logging.structured.json.rename.flat_correlation_id=correlation_id
logging.structured.json.rename.flat_trace_id=trace_id
logging.structured.json.rename.flat_span_id=span_id
logging.structured.json.customizer=com.digitalbank.authservice.FlatStructuredLoggingJsonMembersCustomizer

management.tracing.export.zipkin.enabled=${ZIPKIN_TRACING_ENABLED:false}

server.port=8086

auth.session.policy=REVOKE_PREVIOUS
auth.session.ttl=PT30M
auth.jwt.issuer=digital-bank-auth
auth.jwt.secret=${AUTH_JWT_SECRET:}
auth.jwt.scopes=${AUTH_JWT_SCOPES:}
auth.identity.fixture.username=${AUTH_FIXTURE_USERNAME:}
auth.identity.fixture.password-hash=${AUTH_FIXTURE_PASSWORD_HASH:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
