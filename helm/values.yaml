nameOverride: ""
fullnameOverride: ""

replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: digital-bank-java/auth-service
  tag: "0.0.1"
  pullPolicy: IfNotPresent

runtime:
  profile: default
  configServerUrl: http://config-server:8888

database:
  url: jdbc:postgresql://postgres:5432/auth_service
  driverClassName: org.postgresql.Driver
  secretName: postgres
  usernameKey: POSTGRES_USER
  passwordKey: POSTGRES_PASSWORD
  hibernateDdlAuto: validate
  openInView: "false"

secrets:
  enabled: false
  name: auth-service-secrets
  keys:
    jwtSecret: jwt-secret
    fixturePasswordHash: fixture-password-hash

service:
  type: ClusterIP
  port: 8086

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    path: /actuator/health
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

temporaryStorage:
  sizeLimit: 64Mi

terminationGracePeriodSeconds: 30
