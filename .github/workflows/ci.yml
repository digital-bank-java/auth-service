name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven verification
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Check formatting
        run: git diff --check

  helm:
    name: Helm validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.0

      - name: Lint chart
        run: helm lint helm --strict --values helm/values-sit.yaml

      - name: Render chart
        run: |
          helm template auth-service helm \
            --namespace digital-bank-sit \
            --values helm/values-sit.yaml \
            --set image.tag="${GITHUB_SHA}" \
            > rendered.yaml
          test -s rendered.yaml

  container:
    name: Container build and smoke test
    needs:
      - verify
      - helm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          push: false
          tags: digital-bank-java/auth-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        shell: bash
        run: |
          cleanup() {
            docker rm --force auth-service-ci auth-postgres-ci > /dev/null 2>&1 || true
            if [[ -n "${mock_server_pid:-}" ]]; then
              kill "${mock_server_pid}" > /dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          test "$(docker image inspect \
            --format '{{.Config.User}}' \
            digital-bank-java/auth-service:ci)" = "10001:10001"

          python3 - <<'PY' &
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          response = {
              "name": "auth-service",
              "profiles": ["sit"],
              "label": None,
              "version": "ci",
              "state": None,
              "propertySources": [
                  {
                      "name": "ci",
                      "source": {
                          "server.port": 8086,
                          "digital-bank.service.name": "auth-service",
                          "auth.jwt.issuer": "digital-bank-auth-ci",
                          "auth.jwt.secret": "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=",
                          "auth.session.policy": "REVOKE_PREVIOUS",
                          "auth.session.ttl": "PT30M",
                          "auth.identity.fixture.username": "ci@example.com",
                          "auth.identity.fixture.password-hash": "$2y$10$GTVETCbk6H2ppZUO090OxOARCHKcXq.aLjCoRDdvE0QDEERTGn3rm",
                      },
                  }
              ],
          }

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path not in ("/auth-service/sit", "/auth-service/default"):
                      self.send_error(404)
                      return
                  body = json.dumps(response).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  pass

          HTTPServer(("127.0.0.1", 8888), Handler).serve_forever()
          PY
          mock_server_pid=$!

          for attempt in {1..10}; do
            if curl --fail --silent \
              http://127.0.0.1:8888/auth-service/sit > /dev/null; then
              break
            fi
            sleep 1
          done

          docker run --detach \
            --name auth-postgres-ci \
            --network host \
            --env POSTGRES_DB=auth_service \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            postgres:16-alpine

          postgres_ready=false
          for attempt in {1..30}; do
            if docker exec auth-postgres-ci \
              pg_isready --host 127.0.0.1 --port 5432 --username postgres --dbname auth_service > /dev/null 2>&1; then
              postgres_ready=true
              break
            fi
            sleep 1
          done

          if [[ "${postgres_ready}" != "true" ]]; then
            docker logs auth-postgres-ci
            exit 1
          fi

          docker run --detach \
            --name auth-service-ci \
            --network host \
            --env CONFIG_SERVER_URL=http://127.0.0.1:8888 \
            --env SPRING_PROFILES_ACTIVE=sit \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/auth_service \
            --env SPRING_DATASOURCE_USERNAME=postgres \
            --env SPRING_DATASOURCE_PASSWORD=postgres \
            digital-bank-java/auth-service:ci

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:8086/actuator/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "${ready}" != "true" ]]; then
            docker logs auth-service-ci
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8086/v3/api-docs > /dev/null
